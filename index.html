<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ben 10: A Busca pelo Omnitrix</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background-color: #050a10;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .game-header {
      text-align: center;
      margin-bottom: 10px;
    }

    h1 {
      font-family: 'Press Start 2P', monospace;
      color: #00ff66;
      font-size: 22px;
      text-shadow: 0 0 10px #00ff66;
      margin-bottom: 15px;
    }

    .instructions {
      color: #88aacc;
      font-size: 13px;
      line-height: 1.6;
      background: #111a24;
      padding: 10px;
      border: 2px solid #223344;
      border-radius: 8px;
      max-width: 800px;
    }

    .instructions b {
      color: #00ff66;
    }

    .game-container {
      position: relative;
      width: 800px;
      height: 400px;
      box-shadow: 0 0 30px rgba(0, 255, 102, 0.2);
      border: 4px solid #00ff66;
      border-radius: 8px;
      background-color: #0d1620;
    }

    canvas {
      display: block;
      border-radius: 4px;
    }

    .ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      z-index: 10;
    }

    .hidden {
      display: none !important;
    }

    .ui-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 32px;
      margin-bottom: 15px;
      text-align: center;
    }

    .ui-text {
      font-size: 14px;
      margin-bottom: 30px;
      color: #ccc;
      font-family: 'Press Start 2P', monospace;
      text-align: center;
      line-height: 1.5;
    }

    button {
      background: linear-gradient(180deg, #00ff66 0%, #00cc55 100%);
      color: #000;
      border: none;
      padding: 15px 30px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Press Start 2P', monospace;
      transition: 0.2s;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px #00ff66;
    }
  </style>
</head>
<body>

  <div class="game-header">
    <h1>BEN 10: A JORNADA DO OMNITRIX</h1>
    <div class="instructions">
      <b>[W][A][S][D]</b> ou <b>Setas</b>: Mover | <b>[Espaço]</b>: Pular<br>
      <b>História:</b> Vilgax roubou o Omnitrix! Inicie a jornada sem poderes, lute contra inimigos e aliens corrompidos no caminho, e recupere o relógio no final para salvar o universo!
    </div>
  </div>

  <div class="game-container">
    <canvas id="gameCanvas" width="800" height="400"></canvas>
   
    <!-- Tela de Overlay -->
    <div id="uiOverlay" class="ui-overlay hidden">
      <h2 id="uiTitle" class="ui-title"></h2>
      <p id="uiText" class="ui-text"></p>
      <button onclick="resetGame()">JOGAR NOVAMENTE</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const uiOverlay = document.getElementById('uiOverlay');
    const uiTitle = document.getElementById('uiTitle');
    const uiText = document.getElementById('uiText');

    let gameState = 'PLAYING';
    let score = 0;
    let lives = 3;
    let currentLevel = 1;
    let frameCount = 0;

    // Física
    const GRAVITY = 0.55;
    const JUMP_POWER = -11;
    const PLAYER_SPEED = 4;

    // Controles
    const keys = { right: false, left: false, up: false };

    window.addEventListener('keydown', (e) => {
      if (['ArrowRight', 'd', 'D'].includes(e.key)) keys.right = true;
      if (['ArrowLeft', 'a', 'A'].includes(e.key)) keys.left = true;
      if (['ArrowUp', 'w', 'W', ' '].includes(e.key)) keys.up = true;
    });

    window.addEventListener('keyup', (e) => {
      if (['ArrowRight', 'd', 'D'].includes(e.key)) keys.right = false;
      if (['ArrowLeft', 'a', 'A'].includes(e.key)) keys.left = false;
      if (['ArrowUp', 'w', 'W', ' '].includes(e.key)) keys.up = false;
    });

    let player = { x: 30, y: 250, w: 24, h: 36, dx: 0, dy: 0, grounded: false, invul: 0 };
    let platforms = [];
    let enemies = [];
    let coins = [];
    let stars = [];
    let levelGoal = { x: 740, y: 60, w: 30, h: 30 };

    function initLevel() {
      player = { x: 30, y: 250, w: 24, h: 36, dx: 0, dy: 0, grounded: false, invul: 0 };
     
      // Criar estrelas de fundo
      stars = [];
      for(let i=0; i<50; i++) {
        stars.push({ x: Math.random() * 800, y: Math.random() * 400, size: Math.random() * 2 });
      }

      // Configuração de cada fase
      if (currentLevel === 1) {
        platforms = [
          { x: 0, y: 360, w: 800, h: 40, type: 'ground' },    
          { x: 200, y: 280, w: 120, h: 16, type: 'plat' },
          { x: 400, y: 200, w: 120, h: 16, type: 'plat' },
          { x: 600, y: 120, w: 150, h: 16, type: 'plat' }
        ];
        enemies = [
          { name: 'Kevin', x: 400, y: 324, w: 26, h: 36, dx: 1.5, minX: 300, maxX: 700,
            cHair: '#999999', cShirt: '#333333', cEye: '#000000' }
        ];
        coins = [ { x: 250, y: 240, collected: false }, { x: 450, y: 160, collected: false } ];
        levelGoal = { x: 680, y: 80, w: 30, h: 30 };
      }
      else if (currentLevel === 2) {
        platforms = [
          { x: 0, y: 360, w: 200, h: 40, type: 'ground' },      
          { x: 300, y: 360, w: 200, h: 40, type: 'ground' },
          { x: 600, y: 360, w: 200, h: 40, type: 'ground' },
          { x: 150, y: 260, w: 100, h: 16, type: 'plat' },
          { x: 350, y: 180, w: 100, h: 16, type: 'plat' },
          { x: 550, y: 260, w: 100, h: 16, type: 'plat' }
        ];
        enemies = [
          { name: 'Albedo', x: 320, y: 324, w: 24, h: 36, dx: 2, minX: 300, maxX: 480,
            cHair: '#ffffff', cShirt: '#cc0000', cEye: '#ff0000' },
          { name: 'Chama', x: 350, y: 144, w: 26, h: 36, dx: 1, minX: 350, maxX: 430,
            cHair: '#ff4400', cShirt: '#ffaa00', cEye: '#ffff00' }
        ];
        coins = [ { x: 180, y: 220, collected: false }, { x: 580, y: 220, collected: false } ];
        levelGoal = { x: 700, y: 320, w: 30, h: 30 };
      }
      else if (currentLevel === 3) {
        platforms = [
          { x: 0, y: 360, w: 150, h: 40, type: 'ground' },    
          { x: 200, y: 280, w: 80, h: 16, type: 'plat' },
          { x: 350, y: 200, w: 80, h: 16, type: 'plat' },
          { x: 500, y: 120, w: 80, h: 16, type: 'plat' },
          { x: 650, y: 120, w: 150, h: 16, type: 'plat' }
        ];
        enemies = [
          { name: 'Kevin', x: 200, y: 244, w: 26, h: 36, dx: 0.5, minX: 200, maxX: 260,
            cHair: '#999999', cShirt: '#333333', cEye: '#000000' },
          { name: 'Albedo', x: 500, y: 84, w: 24, h: 36, dx: 0.5, minX: 500, maxX: 560,
            cHair: '#ffffff', cShirt: '#cc0000', cEye: '#ff0000' }
        ];
        coins = [ { x: 390, y: 150, collected: false }, { x: 540, y: 70, collected: false } ];
        levelGoal = { x: 720, y: 80, w: 30, h: 30 };
      }
    }

    function drawCharacter(ctx, x, y, w, h, cHair, cShirt, cEye) {
      ctx.fillStyle = '#ffcc99';
      ctx.fillRect(x + 4, y, w - 8, 12);
      ctx.fillStyle = cHair;
      ctx.fillRect(x + 2, y - 2, w - 4, 8);
      ctx.fillStyle = cEye;
      ctx.fillRect(x + 14, y + 4, 4, 4);
      ctx.fillStyle = cShirt;
      ctx.fillRect(x + 2, y + 12, w - 4, 14);
      ctx.fillStyle = '#000000';
      ctx.fillRect(x + 10, y + 12, 4, 14);
      ctx.fillStyle = '#112244';
      ctx.fillRect(x + 4, y + 26, w - 8, 10);
    }

    function update() {
      if (gameState !== 'PLAYING') return;

      if (keys.right) player.dx = PLAYER_SPEED;
      else if (keys.left) player.dx = -PLAYER_SPEED;
      else player.dx = 0;

      if (keys.up && player.grounded) {
        player.dy = JUMP_POWER;
        player.grounded = false;
      }

      player.dy += GRAVITY;
      player.x += player.dx;
      player.y += player.dy;

      if (player.invul > 0) player.invul--;

      if (player.x < 0) player.x = 0;
      if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;

      if (player.y > canvas.height) takeDamage();

      player.grounded = false;
      for (let p of platforms) {
        if (player.x < p.x + p.w && player.x + player.w > p.x &&
            player.y + player.h > p.y && player.y + player.h < p.y + player.dy + 2) {
          player.grounded = true;
          player.dy = 0;
          player.y = p.y - player.h;
        }
      }

      for (let c of coins) {
        if (!c.collected && Math.hypot((player.x + player.w/2) - c.x, (player.y + player.h/2) - c.y) < 20) {
          c.collected = true;
          score += 150;
        }
      }

      for (let e of enemies) {
        e.x += e.dx;
        if (e.x < e.minX || e.x + e.w > e.maxX) e.dx *= -1;

        if (player.invul === 0 &&
            player.x < e.x + e.w && player.x + player.w > e.x &&
            player.y < e.y + e.h && player.y + player.h > e.y) {
          takeDamage();
        }
      }

      if (player.x < levelGoal.x + levelGoal.w && player.x + player.w > levelGoal.x &&
          player.y < levelGoal.y + levelGoal.h && player.y + player.h > levelGoal.y) {
        advanceLevel();
      }
    }

    function advanceLevel() {
      score += 500;
      if (currentLevel < 3) {
        currentLevel++;
        initLevel();
      } else {
        winGame();
      }
    }

    function takeDamage() {
      lives--;
      if (lives <= 0) {
        gameState = 'GAMEOVER';
        uiTitle.innerText = "DERROTA";
        uiTitle.style.color = "#ff3333";
        uiText.innerHTML = "Vilgax venceu...<br>Os vilões te impediram de recuperar o relógio.<br>O universo está perdido.";
        uiOverlay.classList.remove('hidden');
      } else {
        player.x = 30;
        player.y = 250;
        player.dy = 0;
        player.invul = 60;
      }
    }

    function winGame() {
      gameState = 'WIN';
      score += lives * 1000;
      uiTitle.innerText = "VITÓRIA!";
      uiTitle.style.color = "#00ff66";
      uiText.innerHTML = `O universo está a salvo!<br>Você derrotou os vilões e recuperou o Omnitrix!<br><br>Pontuação: ${score}`;
      uiOverlay.classList.remove('hidden');
    }

    window.resetGame = function() {
      uiOverlay.classList.add('hidden');
      score = 0;
      lives = 3;
      currentLevel = 1;
      initLevel();
      gameState = 'PLAYING';
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#ffffff';
      for(let s of stars) {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
        ctx.fill();
      }
     
      ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
      ctx.font = '12px "Press Start 2P"';
     
      if (currentLevel === 1) {
        ctx.fillText("FASE 1: Planície Escura", 20, 100);
        ctx.fillText("Alcance o portal de energia!", 20, 130);
      } else if (currentLevel === 2) {
        ctx.fillText("FASE 2: Caverna do Perigo", 20, 100);
        ctx.fillText("Cuidado com os buracos...", 20, 130);
      } else if (currentLevel === 3) {
        ctx.fillText("FASE 3: Nave de Vilgax", 20, 100);
        ctx.fillText("O Omnitrix está logo ali!", 20, 130);
      }

      for (let p of platforms) {
        ctx.fillStyle = '#1a2a3a';
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = p.type === 'ground' ? '#00cc55' : '#00ff66';
        ctx.fillRect(p.x, p.y, p.w, 4);
      }

      for (let c of coins) {
        if (!c.collected) {
          ctx.beginPath();
          ctx.arc(c.x, c.y, 6, 0, Math.PI*2);
          ctx.fillStyle = '#ffff00';
          ctx.shadowBlur = 10;
          ctx.shadowColor = '#ffff00';
          ctx.fill();
          ctx.shadowBlur = 0;
        }
      }

      if (currentLevel < 3) {
        ctx.beginPath();
        ctx.arc(levelGoal.x + 15, levelGoal.y + 15, 12, 0, Math.PI*2);
        ctx.fillStyle = '#00ccff';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(levelGoal.x + 15, levelGoal.y + 15, 8, 0, Math.PI*2);
        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#00ccff';
        ctx.fill();
        ctx.shadowBlur = 0;
      } else {
        ctx.beginPath();
        ctx.arc(levelGoal.x + 15, levelGoal.y + 15, 12, 0, Math.PI*2);
        ctx.fillStyle = '#222';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(levelGoal.x + 15, levelGoal.y + 15, 6, 0, Math.PI*2);
        ctx.fillStyle = '#00ff66';
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#00ff66';
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      for (let e of enemies) {
        drawCharacter(ctx, e.x, e.y, e.w, e.h, e.cHair, e.cShirt, e.cEye);
      }

      if (gameState !== 'GAMEOVER') {
        if (player.invul % 10 < 5) {
          drawCharacter(ctx, player.x, player.y, player.w, player.h, '#4a3018', '#00cc00', '#00ff66');
        }
      }

      ctx.fillStyle = '#fff';
      ctx.font = '12px "Press Start 2P"';
      ctx.fillText(`PTS: ${score}`, 15, 25);
      ctx.fillText(`FASE: ${currentLevel}/3`, 320, 25);
     
      ctx.fillStyle = '#ff3333';
      ctx.fillText(`VIDAS: ${lives}`, canvas.width - 120, 25);
    }

    function gameLoop() {
      update();
      draw();
      frameCount++;
      requestAnimationFrame(gameLoop);
    }

    initLevel();
    gameLoop();
  </script>
</body>
</html>
